6v3601o","contents":[{"type":"headline","model":{"blocks":[{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"Zambians warned not to eat dead wildlife after anthrax kills dozens of animals","blocks":[{"type":"fragment","model":{"text":"Zambians warned not to eat dead wildlife after anthrax kills dozens of animals","attributes":[]}}]}}]}}]}},{"type":"timestamp","model":{"timestamp":1789385708586}},{"type":"byline","model":{"blocks":[{"type":"contributor","model":{"blocks":[{"type":"name","model":{"blocks":[{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"Basillioh Rukanga","blocks":[{"type":"fragment","model":{"text":"Basillioh Rukanga","attributes":[]}}]}}]}}]}},{"type":"role","model":{"blocks":[{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"","blocks":[{"type":"fragment","model":{"text":"","attributes":[]}}]}}]}}]}}]}},{"type":"timestamp","model":{"timestamp":1789385708586}}]}},{"type":"image","model":{"blocks":[{"type":"caption","model":{"blocks":[{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"Anthrax mainly affects grazing animals and can lead to sudden death (file photo)","blocks":[{"type":"fragment","model":{"text":"Anthrax mainly affects grazing animals and can lead to sudden death (file photo)","attributes":[]}}]}}]}}]}},{"type":"altText","model":{"blocks":[{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"A hippo that died of anthrax floating in a pool of water in Virunga in neighbouring DR Congo","blocks":[{"type":"fragment","model":{"text":"A hippo that died of anthrax floating in a pool of water in Virunga in neighbouring DR Congo","attributes":[]}}]}}]}}]}},{"type":"rawImage","model":{"width":1360,"height":765,"locator":"edb2/live/3c870970-b024-11f1-95e6-93ee8a80cb38.jpg","originCode":"cpsprodpb","copyrightHolder":"Reuters","suitableForSyndication":true}}],"emphasiseImage":true}},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"Authorities in Zambia have warned people not to eat meat from wildlife after dozens of wild animals, including hippos, elephants, buffalo and a crocodile died following an anthrax outbreak.","blocks":[{"type":"fragment","model":{"text":"Authorities in Zambia have warned people not to eat meat from wildlife after dozens of wild animals, including hippos, elephants, buffalo and a crocodile died following an anthrax outbreak.","attributes":[]}}]}}]}},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"A disaster management agency official said over the weekend that 12 people had been infected with the disease after consuming dead wildlife in the Munyamadzi River area.","blocks":[{"type":"fragment","model":{"text":"A disaster management agency official said over the weekend that 12 people had been infected with the disease after consuming dead wildlife in the Munyamadzi River area.","attributes":[]}}]}}]}},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"The official urged the public not to consume meat from animals that die naturally or from unknown causes, while urging the public to report any such cases. ","blocks":[{"type":"fragment","model":{"text":"The official urged the public not to consume meat from animals that die naturally or from unknown causes, while urging the public to report any such cases. ","attributes":[]}}]}}]}},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"Authorities have also called for hunting in the affected area to be suspended until the extent of the disease and associated risks are established.","blocks":[{"type":"fragment","model":{"text":"Authorities have also called for hunting in the affected area to be suspended until the extent of the disease and associated risks are established.","attributes":[]}}]}}]}},{"type":"advertisement","model":{"adType":"horizontal"},"incrementedType":"mid_1"},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"Officials have not yet ascertained the full geographical extent of the latest outbreak, with surveillance and laboratory investigations ongoing.","blocks":[{"type":"fragment","model":{"text":"Officials have not yet ascertained the full geographical extent of the latest outbreak, with surveillance and laboratory investigations ongoing.","attributes":[]}}]}}]}},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"Anthrax is endemic to Zambia but human deaths are not common. In 2023, the country experienced what was described as an \"unprecedented outbreak\", which killed four people and spread to nine out of 10 provinces.","blocks":[{"type":"fragment","model":{"text":"Anthrax is endemic to Zambia but human deaths are not common. In 2023, the country experienced what was described as an \"unprecedented outbreak\", which killed four people and spread to nine out of 10 provinces.","attributes":[]}}]}}]}},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"Another large-scale outbreak was reported in 2011, with more than 500 cases, when five people died after consuming meat from infected hippos.","blocks":[{"type":"fragment","model":{"text":"Another large-scale outbreak was reported in 2011, with more than 500 cases, when five people died after consuming meat from infected hippos.","attributes":[]}}]}}]}},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"In the latest outbreak in the Munyamadzi Game Management Area, in Muchinga province, Zambia's Disaster Management and Mitigation Unit said 46 hippos, eight elephants, five buffaloes and one crocodile had died since July.","blocks":[{"type":"fragment","model":{"text":"In the latest outbreak in the Munyamadzi Game Management Area, in Muchinga province, Zambia's Disaster Management and Mitigation Unit said 46 hippos, eight elephants, five buffaloes and one crocodile had died since July.","attributes":[]}}]}}]}},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"\"The sad story about the deaths of this wildlife is that the carcasses ended up being eaten by the local people - that's what they depend on for their food,\" said the unit's national coordinator Norman Chipakupaku.","blocks":[{"type":"fragment","model":{"text":"\"The sad story about the deaths of this wildlife is that the carcasses ended up being eaten by the local people - that's what they depend on for their food,\" said the unit's national coordinator Norman Chipakupaku.","attributes":[]}}]}}]}},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"No human deaths have been reported, and the 12 infected people are currently receiving treatment.","blocks":[{"type":"fragment","model":{"text":"No human deaths have been reported, and the 12 infected people are currently receiving treatment.","attributes":[]}}]}}]}},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"Anthrax is caused by a bacteria called Bacillus anthracis, which largely survives as spores that hide away in soil for years before entering an animal through inhalation or a cut or wound.","blocks":[{"type":"fragment","model":{"text":"Anthrax is caused by a bacteria called Bacillus anthracis, which largely survives as spores that hide away in soil for years before entering an animal through inhalation or a cut or wound.","attributes":[]}}]}}]}},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"It mainly affects grazing animals and can lead to sudden death. It can be transmitted from animals to humans through contact with contaminated animal products.","blocks":[{"type":"fragment","model":{"text":"It mainly affects grazing animals and can lead to sudden death. It can be transmitted from animals to humans through contact with contaminated animal products.","attributes":[]}}]}}]}},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"Zambians have been urged not to consume, sell, distribute or handle meat from animals that have
