he Northern Ireland secretary \"when there is clear consensus in the country - when public opinion has changed to the point at which the call has to be considered\".","attributes":[]}}]}}]}},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"A spokesperson for Martin said Trump's comments should \"come as a surprise to no one\" and the US president has been \"consistent in his view that he sees unity in Ireland as the optimal outcome\".","blocks":[{"type":"fragment","model":{"text":"A spokesperson for Martin said Trump's comments should \"come as a surprise to no one\" and the US president has been \"consistent in his view that he sees unity in Ireland as the optimal outcome\".","attributes":[]}}]}}]}},{"type":"image","model":{"blocks":[{"type":"caption","model":{"blocks":[{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"President Trump with the Taoiseach (Irish Prime Minister) Micheál Martin","blocks":[{"type":"fragment","model":{"text":"President Trump with the Taoiseach (Irish Prime Minister) Micheál Martin","attributes":[]}}]}}]}}]}},{"type":"altText","model":{"blocks":[{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"Micheál Martin to the left with blue suit and blue tie. Donald Trump to his right with dark suit and red tie. The Irish and American flag are behind them.","blocks":[{"type":"fragment","model":{"text":"Micheál Martin to the left with blue suit and blue tie. Donald Trump to his right with dark suit and red tie. The Irish and American flag are behind them.","attributes":[]}}]}}]}}]}},{"type":"rawImage","model":{"width":781,"height":440,"locator":"381d/live/31f31f20-ae8b-11f1-b92e-1f49080ec3cb.jpg","originCode":"cpsprodpb","copyrightHolder":"Reuters","suitableForSyndication":true}}]}},{"type":"advertisement","model":{"adType":"horizontal"},"incrementedType":"mid_3"},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"The Good Friday Agreement says the secretary of state must hold a border poll if it appears likely that a majority of people in Northern Ireland would vote for Irish unification - and the circumstances of when that could happen is the subject of constant debate in Northern Ireland and the Republic.","blocks":[{"type":"fragment","model":{"text":"The Good Friday Agreement says the secretary of state must hold a border poll if it appears likely that a majority of people in Northern Ireland would vote for Irish unification - and the circumstances of when that could happen is the subject of constant debate in Northern Ireland and the Republic.","attributes":[]}}]}}]}},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"Earlier this week, Martin said there needed to be more clarity on when a border poll can be called, while Burnham ruled out calling a referendum, describing a poll as \"off the table\".","blocks":[{"type":"fragment","model":{"text":"Earlier this week, Martin said there needed to be ","attributes":[]}},{"type":"urlLink","model":{"text":"more clarity on when a border poll can be called","blocks":[{"type":"fragment","model":{"text":"more clarity on when a border poll can be called","attributes":[]}}],"locator":"https://www.bbc.co.uk/news/articles/cy8z5053g97o","isExternal":false}},{"type":"fragment","model":{"text":", while Burnham ruled out calling a referendum, ","attributes":[]}},{"type":"urlLink","model":{"text":"describing a poll as \"off the table\"","blocks":[{"type":"fragment","model":{"text":"describing a poll as \"off the table\"","attributes":[]}}],"locator":"https://www.bbc.co.uk/news/articles/cy9z43z3g24o","isExternal":false}},{"type":"fragment","model":{"text":".","attributes":[]}}]}}]}},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"Sinn Féin leader Mary Lou McDonald said she acknowledged Trumps comments on a united Ireland and said the onus is on the Taoiseach to begin planning.","blocks":[{"type":"fragment","model":{"text":"Sinn Féin leader Mary Lou Mc ype":"paragraph","model":{"text":"\"When even Donald Trump has clocked that Irish unity is no longer some distant or theoretical prospect, it tells you something about just how far this conversation has shifted.\"","blocks":[{"type":"fragment","model":{"text":"\"When even Donald Trump has clocked that Irish unity is no longer some distant or theoretical prospect, it tells you something about just how far this conversation has shifted.\"","attributes":[]}}]}}]}},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"The Ulster Unionist Party (UUP) leader Jon Burrows said while America is an \"important ally,\" Northern Ireland's future will be decided by its people\".","blocks":[{"type":"fragment","model":{"text":"The Ulster Unionist Party (UUP) leader Jon Burrows said while America is an \"important ally,\" Northern Ireland's future will be decided by its people\".","attributes":[]}}]}}]}},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"The Traditional Unionist Voice (TUV) leader Jim Allister said Trump \"is not the first US President to meddle in the affairs which don't concern him\". ","blocks":[{"type":"fragment","model":{"text":"The Traditional Unionist Voice (TUV) leader Jim Allister said Trump \"is not the first US President to meddle in the affairs which don't concern him\". ","attributes":[]}}]}}]}},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"Ireland's Foreign Minister Helen McEntee said: \"Something to this magnitude can only happen where there's consent from the Irish people.","blocks":[{"type":"fragment","model":{"text":"Ireland's Foreign Minister Helen McEntee said: \"Something to this magnitude can only happen where there's consent from the Irish people.","attributes":[]}}]}}]}},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"\"It's something that that we have to work on and we have to work towards.\"","blocks":[{"type":"fragment","model":{"text":"\"It's something that that we have to work on and we have to work towards.\"","attributes":[]}}]}}]}},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"Later, while attending an event at the US Ambassador to Ireland's residence, Trump said there is \"no good answer\" to a question about a united Ireland.","blocks":[{"type":"fragment","model":{"text":"Later, while attending an event at the US Ambassador to Ireland's residence, Trump said there is \"no good answer\" to a question about a united Ireland.","attributes":[]}}]}}]}},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"Recalling the moment, he said: \"Oh that's a nice question, I have a nice answer, I think, we'll read about it tomorrow.\"","blocks":[{"type":"fragment","model":{"text":"Recalling the moment, he said: \"Oh that's a nice question, I have a nice answer, I think, we'll read about it tomorrow.\"","attributes":[]}}]}}]}},{"type":"advertisement","model":{"adType":"horizontal"},"incrementedType":"mid_4"},{"type":"image","model":{"blocks":[{"type":"altText","model":{"blocks":[{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"A map of an area in Dublin. It features Farmleigh Hosue, Deerflied Residence and Áras an Uachtaráin. ","blocks":[{"type":"fragment","model":{"text":"A map of an area in Dublin. It features Farmleigh Hosue, Deerflied Residence and Áras an Uachtaráin. ","attributes":[]}}]}}]}}]}},{"type":"rawImage","model":{"width":1600,"height":1534,"locator":"94e4/live/460f8730-ae9c-11f1-b1d1-571ed4d7ff2c.png","originCode":"cpsprodpb","copyrightHolder":"BBC","suitableForSyndication":true}}]}},{"type":"text","model":{"blocks":[{"type":"paragraph","model":{"text":"Trump also said his country's relationship with Ireland is \"stronger than ever\".","blocks":[{"type":"fragment","model":{"text":"Trump also said his country's relationship with Ireland is \"stronger than ever\".","attributes":[]}}]}}]}},{"type":"text","model":{"blocks":[{"type":"paragraph","model
